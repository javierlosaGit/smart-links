  <title>Accesorios BAIC BJ30 - Redirigiendo a YouTube...</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
    }
    .container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .thumb {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-yt {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background: #ff0000;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 12px;
      transition: transform 0.15s, background 0.15s;
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
    }
    .btn-yt:active {
      transform: scale(0.98);
      background: #dc2626;
    }
    .subtext {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>

  <script>
    const webUrl = "https://www.youtube.com/shopcollection/SCUCSyq66a4QHGMtWG1Aw21V9vuyK0YG-iW9w?scp=EAM%3D";
    const androidIntent = "intent://www.youtube.com/shopcollection/SCUCSyq66a4QHGMtWG1Aw21V9vuyK0YG-iW9w?scp=EAM%3D#Intent;package=com.google.android.youtube;scheme=https;end";
    const iosAppUrl = "vnd.youtube://www.youtube.com/shopcollection/SCUCSyq66a4QHGMtWG1Aw21V9vuyK0YG-iW9w?scp=EAM%3D";

    function redirectToYouTube() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isAndroid = /android/i.test(ua);
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

      if (isAndroid) {
        window.location.href = androidIntent;
        setTimeout(() => { window.location.href = webUrl; }, 1500);
      } else if (isIOS) {
        window.location.href = iosAppUrl;
        setTimeout(() => { window.location.href = webUrl; }, 1500);
      } else {
        window.location.href = webUrl;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(redirectToYouTube, 400);
    });
  </script>
</head>
<body>
  <div class="container">
    <img class="thumb" src="https://smart-links-javierlosa-git.vercel.app/images/bj30.jpg" alt="BAIC BJ30 Accesorios">
    <div class="spinner"></div>
    <h1>Accesorios BAIC BJ30</h1>
    <p>Abriendo la colección con precios exclusivos en la app de YouTube...</p>
    
    <a class="btn-yt" href="https://www.youtube.com/shopcollection/SCUCSyq66a4QHGMtWG1Aw21V9vuyK0YG-iW9w?scp=EAM%3D" onclick="redirectToYouTube(); return false;">
      Abrir en YouTube
    </a>

    <div class="subtext">Si la app no abre automáticamente, toca el botón rojo arriba.</div>
  </div>
</body>
